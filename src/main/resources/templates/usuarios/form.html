<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head(${usuario.id == null ? 'Novo Usuário' : 'Editar Usuário'})}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: modalReset}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white py-3 border-bottom">
                    <h5 class="fw-bold mb-0" th:text="${usuario.id == null ? '➕ Cadastrar Novo Usuário' : '✏️ Editar Usuário'}"></h5>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome Completo *</label>
                            <input type="text" class="form-control" id="nome" th:field="*{nome}" required placeholder="Ex: João da Silva">
                            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Login / Nome de Usuário *</label>
                            <input type="text" class="form-control" id="username" th:field="*{username}" required placeholder="Ex: joao">
                            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="perfil" class="form-label fw-semibold">Perfil de Acesso *</label>
                            <select class="form-select" id="perfil" th:field="*{perfil}" required>
                                <option th:each="p : ${perfis}" th:value="${p}" th:text="${p.descricao}"></option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label fw-semibold">
                                Senha de Acesso <span th:if="${usuario.id != null}" class="text-muted fw-normal">(Deixe em branco para manter a atual)</span>*
                            </label>
                            <input type="password" class="form-control" id="senha" th:field="*{senha}" 
                                   th:required="${usuario.id == null}" placeholder="Digite uma senha segura">
                            <div class="text-danger small" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></div>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4">
                                <i class="bi bi-save me-1"></i> Salvar Usuário
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
