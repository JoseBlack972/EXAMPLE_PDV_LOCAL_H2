<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema PDV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <i class="bi bi-cart4 display-4"></i>
                    <h3 class="fw-bold mt-2 mb-0">Sistema PDV</h3>
                    <p class="small text-white-50 mb-0">Controle de Caixa & Vendas</p>
                </div>
                <div class="card-body p-4">
                    <div th:if="${mensagemErro}" class="alert alert-danger py-2 small" role="alert">
                        <i class="bi bi-exclamation-circle-fill"></i> <span th:text="${mensagemErro}"></span>
                    </div>
                    <div th:if="${mensagemSucesso}" class="alert alert-success py-2 small" role="alert">
                        <i class="bi bi-check-circle-fill"></i> <span th:text="${mensagemSucesso}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar no Sistema
                        </button>
                    </form>

                    <div class="mt-4 pt-3 border-top text-center text-muted small">
                        <div class="fw-bold mb-1">Acessos Padrão para Teste:</div>
                        <div><span class="badge bg-danger">Admin:</span> admin / admin123</div>
                        <div><span class="badge bg-info text-dark">Operador:</span> operador / operador123</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
