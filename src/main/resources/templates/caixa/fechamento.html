<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments/layout :: head('Fechamento de Caixa')}"></head>
<body class="d-flex flex-column min-vh-100 bg-light">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: modalReset}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-danger text-white py-3 rounded-top-4">
                    <h5 class="fw-bold mb-0"><i class="bi bi-lock-fill me-1"></i> Fechamento do Caixa #<span th:text="${caixa.id}"></span></h5>
                </div>
                <div class="card-body p-4">
                    <h6 class="fw-bold text-secondary mb-3 border-bottom pb-2">Resumo Financeiro do Turno</h6>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-6 col-md-3">
                            <div class="border rounded p-2 text-center bg-light">
                                <div class="text-muted small">Saldo Inicial:</div>
                                <div class="fw-bold">R$ <span th:text="${#numbers.formatDecimal(caixa.saldoInicial, 1, 'POINT', 2, 'COMMA')}"></span></div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="border rounded p-2 text-center bg-light">
                                <div class="text-muted small">Vendas Dinheiro:</div>
                                <div class="fw-bold text-success">R$ <span th:text="${#numbers.formatDecimal(caixa.totalVendasDinheiro, 1, 'POINT', 2, 'COMMA')}"></span></div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="border rounded p-2 text-center bg-light">
                                <div class="text-muted small">Suprimentos:</div>
                                <div class="fw-bold text-primary">R$ <span th:text="${#numbers.formatDecimal(caixa.totalSuprimentos, 1, 'POINT', 2, 'COMMA')}"></span></div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="border rounded p-2 text-center bg-light">
                                <div class="text-muted small">Sangrias:</div>
                                <div class="fw-bold text-danger">R$ <span th:text="${#numbers.formatDecimal(caixa.totalSangrias, 1, 'POINT', 2, 'COMMA')}"></span></div>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-warning py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="fs-6 fw-bold">Saldo Esperado em Dinheiro na Gaveta:</span>
                            <span class="fs-4 fw-bold text-dark">R$ <span th:text="${#numbers.formatDecimal(caixa.saldoDinheiroEsperado, 1, 'POINT', 2, 'COMMA')}"></span></span>
                        </div>
                    </div>

                    <form th:action="@{/caixa/fechamento}" method="post">
                        <div class="mb-3">
                            <label for="saldoFinalInformado" class="form-label fw-bold">Valor Real Contado em Dinheiro *</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-white fw-bold">R$</span>
                                <input type="number" step="0.01" min="0.00" class="form-control fw-bold" 
                                       id="saldoFinalInformado" name="saldoFinalInformado" required autofocus placeholder="0,00">
                            </div>
                            <div class="form-text">Conte as cédulas e moedas na gaveta e informe o valor real apurado.</div>
                        </div>

                        <div class="mb-4">
                            <label for="observacao" class="form-label fw-semibold">Observações do Fechamento</label>
                            <textarea class="form-control" id="observacao" name="observacao" rows="2" 
                                      placeholder="Ex: Turno encerrado normalmente"></textarea>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/caixa}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-danger fw-bold px-4 py-2" onclick="return confirm('Deseja realmente encerrar este caixa?')">
                                <i class="bi bi-lock-fill me-1"></i> Confirmar e Encerrar Caixa
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
